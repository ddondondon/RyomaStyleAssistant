<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>坂本龍馬風アシスタント | Home</title>
  <style>
    :root{
      --bg:#f3f4f6;
      --ink:#1f2937;
      --sub:#6b7280;
      --accent:#f59e0b;
      --bubble:#ffe8c7;      /* ユーザー吹き出し */
      --ryoma:#f2f2f2;       /* 龍馬吹き出し */
      --shadow:0 10px 30px rgba(0,0,0,.10);
      --radius:18px;
    }
    html,body{
      height:100%;
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
                  "Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif;
    }
    .wrap{
      min-height:100%;
      display:grid;
      place-items:center;
      padding:4vh 2vw;
    }
    .frame{
      width:min(960px, 92vw);
      background:#d4d4d8;
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      position:relative;
      overflow:hidden;
      display:grid;
      grid-template-columns: 1.1fr 1.4fr;
      gap:24px;
      padding:28px;
    }

    /* タイトル */
    .title{
      position:absolute;
      left:24px; top:18px;
      font-weight:700;
      letter-spacing:.06em;
      font-size:clamp(14px, 1.6vw, 18px);
      z-index:5;
    }

    /* 右上キャッチ */
    .catch{
      position:absolute;
      right:28px; top:18px;
      font-size:clamp(16px, 2vw, 22px);
      font-weight:700;
      letter-spacing:.12em;
      background:#f2f2f2;
      padding:2px 8px;
      border-radius:8px;
      font-family:"Noto Serif JP", serif;
      z-index:6;
    }

    /* 左：ユーザー */
    .left{
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap:18px;
      padding-left:6px;
    }
    .user-line{
      display:flex;
      align-items:flex-start;
      gap:12px;
    }
    .avatar{
      width:min(56px,6.2vw);
      height:min(56px,6.2vw);
      border-radius:50%;
      overflow:hidden;
      box-shadow:0 4px 14px rgba(0,0,0,.15);
      flex:0 0 auto;
    }
    .avatar img{ width:100%; height:100%; object-fit:cover; }

    .bubble{
      position:relative;
      max-width:min(440px, 38vw);
      background:var(--bubble);
      border-radius:16px;
      padding:14px 16px;
      line-height:1.6;
      box-shadow:0 6px 18px rgba(0,0,0,.10);
      border:1px solid rgba(0,0,0,.05);
    }
    .bubble::before{
      content:"";
      position:absolute;
      left:-10px; top:16px;
      border-width:10px 10px 10px 0;
      border-style:solid;
      border-color:transparent var(--bubble) transparent transparent;
      filter:drop-shadow(-1px 1px 0 rgba(0,0,0,.05));
    }
    .bubble .who{
      display:inline-block;
      font-size:12px;
      color:var(--sub);
      margin-bottom:2px;
    }
    .bubble p{
      margin:.2em 0 0;
      font-size:clamp(12px, 1.3vw, 15px);
    }

    /* ボタン（黒背景＋白文字） */
    .btn{
      cursor:pointer;
      padding:10px 14px;
      border:0;
      border-radius:10px;
      background:#111827;
      color:#fff;
      font-weight:700;
    }
    .btn:disabled{
      opacity:.65;
      cursor:not-allowed;
    }
    .status{
      font-size:12px;
      color:#6b7280;
    }

    /* 右：白枠 */
    .right{
      display:flex;
      align-items:center;
      justify-content:center;
      padding-right:6px;
    }
    .photo{
      width:100%;
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:6px;
    }
    .photo-inner{
      position:relative;
      width:100%;
      height:100%;
      min-height:620px;
      border-radius:14px;
      overflow:hidden;
      background:#ffffff;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.06),
                  0 14px 28px rgba(0,0,0,.09);
    }

    /* 右下ドット（API呼び出し中のみ表示させるので初期は非表示） */
    .dot{
      position:absolute;
      right:14px; bottom:14px;
      width:10px; height:10px;
      border-radius:50%;
      background:var(--accent);
      box-shadow:0 2px 6px rgba(0,0,0,.25);
      z-index:5;
      opacity:.9;
      display:none;  /* ★初期・回答時は非表示 */
    }

    /* ===== 初期/呼び出し中：ヒーロー（coverで大きく表示） ===== */
    .ryoma-hero{
      position:absolute;
      inset:0;
      display:block;
    }
    .ryoma-hero img{
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center;
      filter:grayscale(35%);
      display:block;
      transform: scale(1.06);
    }

    /* ===== 回答表示：小さい写真＋吹き出し（白枠内） ===== */
    .ryoma-chat{
      position:absolute;
      inset:0;
      padding:18px 18px 44px 18px;
      display:none;
      overflow:auto;
      background: rgba(255,255,255,.65);
      backdrop-filter: blur(1px);
    }
    .ryoma-line{
      display:flex;
      justify-content:flex-end;
      align-items:flex-start;
      gap:12px;
      padding-top:8px;
    }
    .ryoma-avatar{
      width:56px;
      height:56px;
      border-radius:50%;
      overflow:hidden;
      box-shadow:0 4px 14px rgba(0,0,0,.15);
      flex:0 0 auto;
      background:#eee;
    }
    .ryoma-avatar img{
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center;
      filter:grayscale(35%);
      transform:scale(1.15);
      display:block;
    }
    .ryoma-bubble{
      position:relative;
      max-width:min(520px, 78%);
      background:var(--ryoma);
      border-radius:16px;
      padding:14px 16px;
      line-height:1.7;
      box-shadow:0 10px 24px rgba(0,0,0,.18);
      border:1px solid rgba(0,0,0,.08);
      display:none;
    }
    .ryoma-bubble::before{
      content:"";
      position:absolute;
      right:-10px; top:18px;
      border-width:10px 0 10px 10px;
      border-style:solid;
      border-color:transparent transparent transparent var(--ryoma);
      filter:drop-shadow(1px 1px 0 rgba(0,0,0,.06));
    }
    .ryoma-bubble .who{
      display:inline-block;
      font-size:12px;
      font-weight:700;
      color:#374151;
      opacity:.85;
      margin-bottom:6px;
      letter-spacing:.06em;
    }
    .ryoma-bubble .text{
      white-space:pre-wrap;
      font-size:clamp(12px, 1.25vw, 15px);
    }

    @media (max-width: 820px){
      .frame{ grid-template-columns: 1fr; height:auto; }
      .right{ order:2; }
      .left{ order:1; padding-right:6px; }
      .bubble{ max-width:100%; }
      .catch{ position:static; margin-left:auto; margin-top:6px; }
      .title{ position:static; margin-bottom:6px; }
      .photo-inner{ min-height:520px; }
      .ryoma-hero img{ transform: scale(1.04); }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="frame" role="region" aria-label="メインビュー">
      <div class="title">坂本龍馬風アシスタント - SampleUI - </div>
      <div class="catch" id="catch">お手伝いするぜよ</div>

      <!-- 左：ユーザー -->
      <div class="left">
        <div class="user-line">
          <figure class="avatar" aria-label="お爺さんアイコン">
            <img src="/assets/ojiisan_face.png" alt="お爺さんの顔" />
          </figure>

          <div class="bubble" aria-live="polite">
            <span class="who">ユーザー</span>

            <p style="margin:0 0 10px 0;">質問を入力して「龍馬に聞く」を押してくだされ。</p>

            <textarea id="q"
              rows="4"
              placeholder="例：坂本龍馬は何をした人でごわすか？"
              style="width:100%; box-sizing:border-box; padding:10px; border-radius:10px; border:1px solid rgba(0,0,0,.15); font-size:14px;"></textarea>

            <div style="display:flex; gap:10px; margin-top:10px; align-items:center;">
              <button id="btn" class="btn">龍馬に聞く</button>
              <span id="status" class="status"></span>
            </div>
          </div>
        </div>
      </div>

      <!-- 右：白枠の中でレイアウト切替 -->
      <div class="right">
        <div class="photo">
          <div class="photo-inner">

            <!-- 初期/呼び出し中：大きい写真 -->
            <div id="ryoma-hero" class="ryoma-hero" aria-label="龍馬写真（大）">
              <img src="/assets/Ryoma_image.jpg" alt="坂本龍馬の写真" />
            </div>

            <!-- 回答時：小さい写真 + 吹き出し（白枠内） -->
            <div id="ryoma-chat" class="ryoma-chat" aria-label="龍馬回答（チャット表示）">
              <div class="ryoma-line">
                <div id="a" class="ryoma-bubble">
                  <span class="who">龍馬</span>
                  <div class="text" id="a_text"></div>
                </div>

                <figure class="ryoma-avatar" aria-label="龍馬アイコン（小）">
                  <img src="/assets/Ryoma_image.jpg" alt="坂本龍馬の写真（小）" />
                </figure>
              </div>
            </div>

            <!-- ★API呼び出し中のみ表示 -->
            <div class="dot" id="loadingDot" aria-hidden="true"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const $q = document.getElementById("q");
    const $btn = document.getElementById("btn");
    const $status = document.getElementById("status");
    const $catch = document.getElementById("catch");

    const $hero = document.getElementById("ryoma-hero");
    const $chat = document.getElementById("ryoma-chat");

    const $a = document.getElementById("a");
    const $aText = document.getElementById("a_text");

    const $loadingDot = document.getElementById("loadingDot");

    function showHero() {
      // 初期・API呼び出し中は大写真
      $hero.style.display = "block";
      $chat.style.display = "none";
      $a.style.display = "none";
      $aText.textContent = "";
    }

    function showChat(answerText) {
      // 回答確定時のみチャット表示へ
      $hero.style.display = "none";
      $chat.style.display = "block";
      $aText.textContent = answerText || "(回答が空でごわす)";
      $a.style.display = "block";
      $chat.scrollTop = 0;
    }

    function setLoading(isLoading) {
      $btn.disabled = isLoading;
      $q.disabled = isLoading;

      // ★ドットはAPI呼び出し中のみ表示
      if ($loadingDot) {
        $loadingDot.style.display = isLoading ? "block" : "none";
      }
    }

    // 初期はヒーロー、ドットなし
    showHero();
    setLoading(false);

    async function askRyoma() {
      const question = ($q.value || "").trim();
      if (!question) {
        $status.textContent = "質問を入力してくだされ。";
        return;
      }

      // 呼び出し開始：ヒーロー（大写真） + ドット表示
      showHero();
      setLoading(true);

      $status.textContent = "API呼び出し中";
      if ($catch) $catch.textContent = "考え中なので、今しばし待つぜよ。。。";

      try {
        const res = await fetch("/api/ask_ryoma", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({question}),
        });

        if (!res.ok) {
          const t = await res.text();
          throw new Error(`HTTP ${res.status}: ${t}`);
        }

        const data = await res.json();

        // 成功：チャット表示（この時点でドットは消える）
        showChat(data.answer);

        $status.textContent = "完了でごわす。";
        if ($catch) $catch.textContent = "回答するぜよ";
      } catch (e) {
        console.error(e);

        // 失敗も“回答確定”扱いでチャットにエラーを表示
        showChat(String(e));

        $status.textContent = "失敗したでごわす。console と logs を確認してくだされ。";
        if ($catch) $catch.textContent = "しくじったぜよ。。。";
      } finally {
        // ★API終了：ドット非表示
        setLoading(false);
      }
    }

    $btn.addEventListener("click", askRyoma);
    $q.addEventListener("keydown", (ev) => {
      if ((ev.ctrlKey || ev.metaKey) && ev.key === "Enter") askRyoma();
    });
  </script>
</body>
</html>
