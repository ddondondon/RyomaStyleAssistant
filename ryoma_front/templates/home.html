<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>坂本龍馬風アシスタント | Home</title>
  <style>
    :root{
      --bg:#f3f4f6;          /* ページ背景 */
      --panel:#ffffff;       /* パネル背景 */
      --ink:#1f2937;         /* 文字色 */
      --sub:#6b7280;         /* サブ文字色 */
      --accent:#f59e0b;      /* アクセント(吹き出し尾など) */
      --bubble:#ffe8c7;      /* 吹き出し背景(薄い橙) */
      --shadow:0 10px 30px rgba(0,0,0,.10);
      --radius:18px;
    }
    html,body{
      height:100%;
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   "Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif;
    }
    .wrap{
      min-height:100%;
      display:grid;
      place-items:center;
      padding:4vh 2vw;
    }
    .frame{
      width:min(960px, 92vw);
      height:auto;
      background:#d4d4d8;     /* ✅ 濃いめのグレーに変更 */
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      position:relative;
      overflow:hidden;
      display:grid;
      grid-template-columns: 1.1fr 1.4fr;
      gap:24px;
      padding:28px;
    }

    /* 見出し（左上） */
    .title{
      position:absolute;
      left:24px; top:18px;
      font-weight:700;
      letter-spacing:.06em;
      font-size: clamp(14px, 1.6vw, 18px);
      color:var(--ink);
    }

    /* 右上キャッチ */
    .catch{
      position:absolute;
      right:28px; top:18px;
      font-size: clamp(16px, 2vw, 22px);
      font-weight:700;
      letter-spacing:.12em;
      color:#111827;
      opacity:.95;
    }

    /* 左カラム：ユーザー発話 */
    .left{
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap:18px;
      padding-left:6px;
    }
    .user-line{
      display:flex;
      align-items:flex-start;
      gap:12px;
    }
    .avatar{
      width:min(56px,6.2vw);
      height:min(56px,6.2vw);
      border-radius:50%;
      overflow:hidden;
      box-shadow:0 4px 14px rgba(0,0,0,.15);
      flex:0 0 auto;
    }
    .avatar img{ width:100%; height:100%; object-fit:cover; }

    .bubble{
      position:relative;
      max-width:min(440px, 38vw);
      background:var(--bubble);
      border-radius:16px;
      padding:14px 16px 14px 16px;
      line-height:1.6;
      box-shadow:0 6px 18px rgba(0,0,0,.10);
      border:1px solid rgba(0,0,0,.05);
    }
    .bubble::before{
      content:"";
      position:absolute;
      left:-10px; top:16px;
      border-width:10px 10px 10px 0;
      border-style:solid;
      border-color:transparent var(--bubble) transparent transparent;
      filter: drop-shadow(-1px 1px 0 rgba(0,0,0,.05));
    }
    .bubble .who{
      display:inline-block;
      font-size:12px;
      color:var(--sub);
      margin-bottom:2px;
    }
    .bubble p{
      margin:.2em 0 0;
      font-size: clamp(12px, 1.3vw, 15px);
    }

    /* 右カラム：龍馬写真 */
    .right{
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .photo{
      width:100%;
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:6px;
    }
    .photo-inner{
      position:relative;
      width:100%;
      height:100%;
      border-radius:14px;
      overflow:hidden;
      
      background:#f2f2f2;   /* ✅ 薄い明るめのグレー */
      
      box-shadow:
        inset 0 0 0 1px rgba(0,0,0,.06),
        0 14px 28px rgba(0,0,0,.09);
    }
    .photo-inner img{
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center;
      filter: grayscale(35%);
    }

    /* 右下ワンポイント（小さな丸） */
    .dot{
      position:absolute;
      right:14px; bottom:14px;
      width:10px; height:10px;
      border-radius:50%;
      background:var(--accent);
      box-shadow:0 2px 6px rgba(0,0,0,.25);
      opacity:.9;
    }

    /* 画面が狭い時は縦積み */
    @media (max-width: 820px){
      .frame{
        grid-template-columns: 1fr;
        aspect-ratio:auto;
        height:auto;
      }
      .right{ order:2; }
      .left{ order:1; padding-right:6px; }
      .bubble{ max-width:100%; }
      .catch{ position:static; margin-left:auto; margin-top:6px; }
      .title{ position:static; margin-bottom:6px; }
    }
    /* 見出しと“お手伝いします”を最前面に */
    .title,
    .catch {
      position: absolute; /* 既に指定済みだが明示 */
      z-index: 5;         /* ← これがポイント */
    }

    /* 右側パネル群は背面側にしておく */
    .right,
    .right .photo,
    .right .photo-inner {
      position: relative; /* 既に指定済みだが明示 */
      z-index: 1;
    }

    /* 視認性を上げたい場合は半透明の下地を付ける（任意） */
    .catch{
      background:#f2f2f2;   /* ✅ 薄い明るめのグレー */
      padding: 2px 8px;                  /* 任意 */
      border-radius: 8px;                /* 任意 */
      /* フォント変更はここ。後述 */
      font-family: "Noto Serif JP", serif; /* ←ここを好みのフォントに */
      font-weight: 700;                    /* お好みで */
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="frame" role="region" aria-label="メインビュー">
      <!-- 左上の見出し（画像のレイアウトに合わせた位置） -->
      <div class="title">坂本龍馬風アシスタント - SampleUI - </div>

      <!-- 右上のキャッチ（画像の文言は必要に応じて差し替え） -->
      <div class="catch">考え中なので、今しばし待つぜよ。。。</div>

      <!-- 左：ユーザー吹き出し -->
      <div class="left">
        <div class="user-line">
          <figure class="avatar" aria-label="お爺さんアイコン">
            <img src="/assets/ojiisan_face.png" alt="お爺さんの顔" />
          </figure>
          <div class="bubble" aria-live="polite">
            <span class="who">ユーザー</span>
            <!-- ↓テキストは任意で調整してください -->
            <p>本日のおすすめや、ToDo の進め方を教えてくだされ。</p>
            <p>（例）環境整備の続きから始めたいでごわす。</p>
          </div>
        </div>
      </div>

      <!-- 右：龍馬イメージ -->
      <div class="right">
        <div class="photo">
          <div class="photo-inner">
            <img src="/assets/Ryoma_image.jpg" alt="坂本龍馬の写真" />
            <div class="dot" aria-hidden="true"></div>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
